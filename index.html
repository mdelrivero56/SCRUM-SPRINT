{const th=ls(K+'-th');if(th)document.documentElement.dataset.theme=th}

const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>fmt(new Date());
const act=()=>{const a=S.sprints.find(s=>s.status==='active');if(a&&!Array.isArray(a.dailies))a.dailies=[];return a},sum=a=>a.reduce((x,i)=>x+i.pts,0);
const addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return fmt(x)};
const wdays=(a,b)=>{const r=[];for(let d=a;d<=b;d=addD(d,1)){const w=new Date(d+'T12:00').getDay();if(w&&w<6)r.push(d)}return r};
const closedSprints=()=>S.sprints.filter(s=>s.status==='closed');
const avgVel=()=>{const c=closedSprints();return c.length?Math.round(c.reduce((x,s)=>x+s.velocity,0)/c.length):0};
const sel=(id,arr,v)=>`<select id="${id}">${arr.map(o=>`<option ${o==v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
const TABS=[['proj','📁 Proyectos y avances'],['board','📋 Tablero del Sprint'],['plan','🗓️ Planeación'],['metrics','📈 Métricas'],['close','🏁 Cierre del Sprint'],['hist','🕘 Historial'],['topics','💬 Temas del equipo'],['roulette','🎡 Ruleta'],['guide','📖 Guía Scrum'],['sync','⚙️ Compartir y cuenta']];

const A={

  navigator.clipboard?.writeText(t).then(()=>alert('Copiado. Pégalo en la descripción de avance de Bi-nnova.'),()=>prompt('Copia:',t))},

function head(a){const t=sum(a.items),d=sum(a.items.filter(i=>i.status=='done')),left=Math.max(0,wdays(today(),a.end).length),p=t?Math.round(d/t*100):0;
 return `<div class="card"><div class="row" style="justify-content:space-between"><div><h2>${esc(a.name)} <small>· ${esc(a.dept)}</small></h2><div class="mu">🎯 ${esc(a.goal)||'Sin objetivo definido'}</div><small>${a.start} → ${a.end}</small></div>${ring(p,84)}</div>
 <div class="kpis" style="margin-top:10px"><div class="kpi"><small>Puntos hechos</small><b>${d}/${t}</b></div><div class="kpi"><small>Avance del sprint</small><b>${p}%</b></div><div class="kpi"><small>Días hábiles restantes</small><b>${left}</b></div><div class="kpi"><small>Bloqueados</small><b>${a.items.filter(i=>i.status=='blocked').length}</b></div></div><div class="bar" style="margin-top:10px"><i style="width:${p}%"></i></div></div>`}

function board(){const a=act();if(!a)return empty();
 return head(a)+stack(a)+`<div class="cols">${COLS.map(([k,n])=>{const l=a.items.filter(i=>i.status==k);return `<div class="col" data-c="${k}"><h3>${n} · ${l.length} (${sum(l)} pts)</h3>${l.map(i=>`<div class="it"><div class="t">${esc(i.title)}</div><div class="tag">${esc(i.project)} · ${esc(i.owner)||'sin responsable'} <span class="pt">${i.pts}</span></div><div class="a"><button class="btn s" onclick="A.move('${i.id}',-1)">◀</button><button class="btn s" onclick="A.move('${i.id}',1)">▶</button><button class="btn s" onclick="A.toBack('${i.id}')">↩ backlog</button><button class="btn s d" onclick="A.del('${i.id}')">✕</button></div></div>`).join('')}</div>`}).join('')}</div>`}

function empty(){const s=today();return `<div class="card"><div style="text-align:center">${loop(120,'me')}</div><h2>Nuevo Sprint</h2><p class="mu">No hay sprint activo. Define el objetivo y las fechas (lo común: 2 semanas).</p><div class="row"><label>Nombre<input id="sn" placeholder="Sprint 1"></label><label>Departamento${sel('sd',DEPTS)}</label><label>Inicio<input id="ss" type="date" value="${s}"></label><label>Fin<input id="se" type="date" value="${addD(s,13)}"></label></div><label class="mu" style="display:block;margin:8px 0 2px;font-size:12px">Objetivo del Sprint (Sprint Goal)</label><textarea id="sg" style="min-height:60px"></textarea><button class="btn p" style="margin-top:8px" onclick="A.newSprint()">Iniciar sprint</button></div>`}

function plan(){const a=act(),v=avgVel();
 const form=`<div class="card"><h2>Agregar al Product Backlog</h2><div class="row"><label>Actividad<input id="it" size="28"></label><label>Proyecto<input id="ip" list="pl" value="${esc((S.projects.find(p=>p.id==S.pid)||{}).name||PRJ[0])}"><datalist id="pl">${[...new Set([...S.projects.map(p=>p.name),...PRJ])].map(p=>`<option>${esc(p)}`).join('')}</datalist></label><label>Responsable<input id="io" size="14"></label><label>Puntos<select id="ipt">${[1,2,3,5,8,13].map(n=>`<option>${n}</option>`).join('')}</select></label><button class="btn p" onclick="A.add()">Agregar</button></div></div>`;
 const cap=a?`<div class="card"><b>Capacidad:</b> comprometidos ${sum(a.items)} pts · velocidad promedio histórica ${v||'sin datos'} pts ${v&&sum(a.items)>v*1.2?'<b style="color:var(--bad)">⚠ por encima de tu capacidad</b>':''}</div>`:'';
 const bl=`<div class="card"><h2>Product Backlog (${S.backlog.length})</h2><div class="scroll"><table class="tbl"><tr><th>Actividad</th><th>Proyecto</th><th>Resp.</th><th>Pts</th><th></th></tr>${S.backlog.map(i=>`<tr><td>${esc(i.title)}</td><td>${esc(i.project)}</td><td>${esc(i.owner)}</td><td>${i.pts}</td><td>${a?`<button class="btn s" onclick="A.toSprint('${i.id}')">→ Sprint</button> `:''}<button class="btn s d" onclick="A.del('${i.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan=5 class="mu">Vacío</td></tr>'}</table></div></div>`;
 return (a?head(a):empty())+cap+form+bl}

function chart(a){const days=wdays(a.start,a.end),n=days.length;if(n<2)return '';const t=sum(a.items)||1,W=640,H=240,p=34,x=i=>p+i*(W-2*p)/(n-1),y=v=>p+(1-v/t)*(H-2*p);
 const ideal=days.map((_,i)=>`${x(i)},${y(t*(1-i/(n-1)))}`).join(' ');

const COL={todo:'#94a3b8',doing:'#3b82f6',blocked:'#c53030',done:'#2f855a'};
function ring(p,z){z=z||92;const r=z/2-8,c=2*Math.PI*r,m=z/2;return `<svg width="${z}" height="${z}" viewBox="0 0 ${z} ${z}"><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--bd)" stroke-width="9"/><circle cx="${m}" cy="${m}" r="${r}" fill="none" stroke="var(--pr)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 ${m} ${m})"/><text x="50%" y="50%" text-anchor="middle" dy=".35em" font-size="${z/4.2}" font-weight="700" fill="var(--tx)">${p}%</text></svg>`}

function vbars(rw){const m=Math.max(...rw.map(r=>r[1]),1),W=Math.max(300,rw.length*52),H=150;return `<div class="scroll"><svg viewBox="0 0 ${W} ${H+24}" width="${W}">${rw.map((r,i)=>{const h=r[1]/m*H,x=i*52+10;return `<rect x="${x}" y="${H-h}" width="34" height="${h}" rx="4" fill="var(--pr)"/><text x="${x+17}" y="${H-h-4}" text-anchor="middle" font-size="11" fill="var(--tx)">${r[1]}</text><text x="${x+17}" y="${H+15}" text-anchor="middle" font-size="10" fill="var(--mu)">${esc(r[0])}</text>`}).join('')}</svg></div>`}

const PAL=['#1e3a8a','#c9a227','#2f855a','#c53030','#3b82f6','#8b5cf6','#0891b2','#ea580c'],ringc=(p,z,c)=>ring(p,z).replace('stroke="var(--pr)"','stroke="'+c+'"');

function metrics(){const a=act();if(!a)return empty();const wd=wdays(a.start,a.end),ex=wd.length?Math.round(wd.filter(d=>d<=today()).length/wd.length*100):0,tt=sum(a.items),rl=tt?Math.round(sum(a.items.filter(i=>i.status=='done'))/tt*100):0,ok=rl>=ex-5,pp={};a.items.forEach(i=>pp[i.project]=(pp[i.project]||0)+i.pts);const it=a.items,st=COLS.map(([k,n])=>[n,it.filter(i=>i.status==k).length,COL[k]]),ow={},pr={},dd={},dp={};
 it.forEach(i=>{const o=i.owner||'Sin responsable';ow[o]=(ow[o]||0)+i.pts;(pr[i.project]=pr[i.project]||[]).push(i)});
 const pe=Object.entries(pr).map(([p,l])=>[p,Math.round(sum(l.filter(i=>i.status=='done'))/sum(l)*100)]);
 return head(a)+`<div class="g3"><div class="card"><h2>Estado de las actividades</h2>${donut(st)}</div><div class="card"><h2>Carga por responsable (pts)</h2>${hbars(Object.entries(ow).sort((x,y)=>y[1]-x[1]))}</div></div><div class="card"><h2>Burndown</h2>${chart(a)}</div><div class="g3"><div class="card"><h2>Salud del sprint</h2><div class="ring">${ringc(rl,100,ok?COL.done:COL.blocked)}${ringc(ex,100,'#94a3b8')}<div><p><b>Real:</b> ${rl}% entregado<br><b>Esperado:</b> ${ex}% del calendario</p><span class="ch ${ok?'g':'r'}">${ok?'En ritmo':'Por debajo del ritmo'}</span></div></div></div><div class="card"><h2>Puntos por proyecto</h2>${donut(Object.entries(pp).map(([k,v],i)=>[k,v,PAL[i%PAL.length]]))}</div></div> <div class="g3"><div class="card"><h2>Avance reportado de los proyectos</h2>${hbars(S.projects.map(q=>[q.name,q.pct||0]),'%',100)}</div><div class="card"><h2>Hitos completados por proyecto</h2>${hbars(S.projects.map(q=>[q.name,q.ms.length?Math.round(q.ms.filter(m=>m.st==2).length/q.ms.length*100):0]),'%',100)}</div></div>

function close_(){const a=act();if(!a)return empty();const dn=a.items.filter(i=>i.status=='done'),pd=a.items.filter(i=>i.status!='done'),c=sum(a.items),v=sum(dn),p=c?Math.round(v/c*100):0,

 return `<div class="card"><h2>Sprint Review · ${esc(a.name)}</h2><div class="ring">${ring(p,110)}<div><p><b>${v}</b> de <b>${c}</b> puntos comprometidos fueron entregados.</p><p class="mu">Velocidad promedio anterior: ${avgVel()||'sin datos'} pts. Compara lo planeado con lo realizado.</p></div></div>

 ${ta('review','Retroalimentación de interesados','¿Qué dijeron del incremento? ¿Qué cambia en el backlog?',a.review,'var(--pr)')}</div>
 <div class="card"><h2>Retrospectiva del equipo</h2><div class="g3" style="margin:0">${ta('bien','😊 ¿Qué salió bien?','Mantener',a.retro.bien,'#2f855a')}${ta('mejorar','🔧 ¿Qué mejorar?','Problemas y causas',a.retro.mejorar,'#c9a227')}${ta('acc','🎯 Acciones','Para el próximo sprint, con responsable',a.retro.acc,'#3b82f6')}</div></div>

function hist(){const c=closedSprints();if(!c.length)return `<div class="card mu" style="text-align:center">${loop(110,'mh2')}<br>Aún no hay sprints cerrados. Cuando cierres el primero, aquí verás tu velocidad.</div>`;const mx=Math.max(...c.map(s=>Math.max(s.velocity,s.committed)),1);
 return `<div class="card"><h2>Comprometido vs entregado</h2>${gbars(c.map(s=>[s.name,s.committed,s.velocity]))}</div><div class="card"><h2>Velocidad por sprint</h2><p class="mu">Promedio: <b>${avgVel()} pts</b> — úsalo como capacidad para planear el siguiente.</p>${c.map(s=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${esc(s.name)} <small>${esc(s.dept)}</small></span><b>${s.velocity}/${s.committed} pts (${s.committed?Math.round(s.velocity/s.committed*100):0}%)</b></div><div class="bar"><i style="width:${s.velocity/mx*100}%"></i></div></div>`).join('')}</div>`
 +c.slice().reverse().map(s=>`<div class="card"><h2>${esc(s.name)} <small>${s.start} → ${s.end}</small></h2><div>🎯 ${esc(s.goal)}</div><details><summary>Review y retrospectiva</summary><p><b>Review:</b> ${esc(s.review)||'—'}</p><p><b>Bien:</b> ${esc(s.retro.bien)||'—'}</p><p><b>Mejorar:</b> ${esc(s.retro.mejorar)||'—'}</p><p><b>Acciones:</b> ${esc(s.retro.acc)||'—'}</p></details></div>`).join('')}

 <div class="card"><h2>Riesgos y bloqueos</h2>${p.rk.map((r,i)=>`<div class="li"><span>${esc(r.t)}</span>${x('rk',i)}</div>`).join('')||'<p class="mu">Sin riesgos.</p>'}${add('rk','<input id="rkt" placeholder="Riesgo o bloqueo" size="26">')}</div></div>
 <div class="card"><h2>Puntos de vista sobre el avance</h2>${p.vw.map((v,i)=>`<div class="li"><span><b>${esc(v.who)}</b> <small>${esc(v.role)}</small> <span class="ch ${v.tone}">${TN[v.tone]}</span><br>${esc(v.t)}</span>${x('vw',i)}</div>`).join('')||'<p class="mu">Aún nadie ha opinado.</p>'}

function guide(){const d=(t,b,o)=>`<details class="card" ${o?'open':''}><summary><b>${t}</b></summary>${b}</details>`;
 return `<div class="card" style="text-align:center">${loop(130,'mg')}<p class="mu" style="margin:0">Agile es el enfoque · Scrum es el método · el Sprint es el ritmo</p></div><div class="note">Guía rápida de Scrum centrada en el <b>Sprint</b>. Cada sección indica en qué pestaña de esta herramienta se aplica.</div>`
 +d('1. Agile y Scrum en pocas palabras',`<p><b>Agile</b>: trabajar poco a poco, de forma organizada y con revisiones constantes, en vez de esperar al final para saber si algo salió bien. <b>Scrum</b>: método de Agile que organiza el trabajo en periodos cortos (Sprints) con reuniones y herramientas de seguimiento.</p><p><b>Planear → Trabajar → Revisar → Detectar problemas → Mejorar → Volver a trabajar.</b></p>`,1)
 +d('2. El ciclo del Sprint',`<div class="scroll"><table class="tbl"><tr><th>Etapa</th><th>Pregunta clave</th><th>En esta herramienta</th></tr><tr><td>Product Backlog</td><td>¿Qué hay que hacer?</td><td>Planeación</td></tr><tr><td>Sprint Planning</td><td>¿Qué haremos en este Sprint?</td><td>Planeación → "→ Sprint"</td></tr><tr><td>Sprint</td><td>¡Manos a la obra!</td><td>Tablero</td></tr><tr><td>Seguimiento</td><td>¿Realmente avanzamos?</td><td>Métricas y Proyectos</td></tr><tr><td>Sprint Review</td><td>¿Qué logramos?</td><td>Review y Retro</td></tr><tr><td>Retrospectiva</td><td>¿Cómo mejoramos?</td><td>Review y Retro</td></tr></table></div><p class="mu">Al terminar la retrospectiva empieza un nuevo Sprint y el ciclo se repite hasta cerrar el proyecto.</p>`)
 +d('3. El Sprint: reglas básicas',`<ul><li><b>Periodo fijo</b> (timebox) de 1 a 4 semanas; lo común son 2. Al terminar uno empieza el siguiente sin pausas.</li><li><b>Sprint Goal</b>: el objetivo del Sprint. No cambia durante el Sprint; el alcance sí se puede renegociar si hay nueva información.</li><li><b>Duración constante</b>: no se alarga el Sprint para "terminar un poco más". Lo no terminado regresa al backlog (la herramienta lo hace al cerrar).</li><li><b>Calidad constante</b>: algo está "Hecho" solo si cumple la Definición de Terminado.</li><li>Solo el Product Owner puede cancelar un Sprint, y es raro.</li></ul>`)
 +d('4. Sprint Planning: por qué, qué y cómo',`<ul><li><b>¿Por qué?</b> Define el objetivo del Sprint.</li><li><b>¿Qué?</b> Elige del backlog lo que cabe. Ejemplo: de 10 tareas, 3 se hacen ahora, 2 después y 5 aún no se pueden hacer.</li><li><b>¿Cómo?</b> Reparte responsables y divide lo grande en tareas pequeñas.</li></ul><p><b>Puntos:</b> estiman el esfuerzo relativo (1, 2, 3, 5, 8, 13). Usa la <b>velocidad promedio</b> de sprints anteriores como capacidad; la herramienta avisa si te comprometes por encima de ella.</p>`)
 +d('5. Daily Scrum (reunión del equipo)',`<ul><li>Dura unos 15 minutos y se hace todos los días a la misma hora.</li><li><b>Ayer</b>: ¿qué hice? · <b>Hoy</b>: ¿qué haré? · <b>Bloqueos</b>: ¿qué me impide avanzar?</li><li>Es una reunión del equipo; esta herramienta no la registra. Los bloqueos importantes se anotan en el <b>Tablero</b> (columna Bloqueado) o en <b>Riesgos y bloqueos</b> del proyecto.</li><li>Sirve para detectar bloqueos a tiempo y evitar que un proyecto se estanque sin seguimiento. No es una reunión para resolver el problema, solo para verlo.</li></ul>`)
 +d('6. Seguimiento del avance',`<ul><li><b>Burndown</b>: la línea real debe seguir la ideal. Si se queda arriba, hay atraso.</li><li><b>% de avance por proyecto</b>: Semana 1 20% → Semana 2 35% → Semana 3 50% → Semana 4 70%. Mira la tendencia, no un solo dato.</li><li>En Bi-nnova se registra el % de avance, las actividades realizadas, pendientes y bloqueos. Usa <b>Copiar para Bi-nnova</b> en Métricas.</li></ul>`)
 +d('7. Review y Retrospectiva',`<div class="scroll"><table class="tbl"><tr><th></th><th>Sprint Review</th><th>Retrospectiva</th></tr><tr><td>Revisa</td><td>El <b>producto</b>: lo planeado vs. lo hecho</td><td>La <b>forma de trabajar</b> del equipo</td></tr><tr><td>Participan</td><td>Equipo e interesados</td><td>Solo el equipo</td></tr><tr><td>Resultado</td><td>Ajustes al backlog</td><td>Acciones concretas para el próximo Sprint</td></tr></table></div><p>Ejemplo: "Nos atrasamos porque las tareas no estaban bien distribuidas" → acción: "Asignar responsables desde el inicio".</p>`)
 +d('8. Roles, artefactos y Definición de Terminado',`<ul><li><b>Product Owner</b>: decide el orden de prioridad del backlog. <b>Scrum Master</b>: cuida que se siga el proceso y quita obstáculos. <b>Developers</b>: hacen el trabajo del Sprint.</li><li><b>Artefactos</b>: Product Backlog (meta: Product Goal), Sprint Backlog (meta: Sprint Goal) e Incremento (meta: Definición de Terminado).</li><li><b>Definición de Terminado</b>: lista acordada de lo que debe cumplirse para dar algo por hecho (probado, revisado, publicado).</li></ul>`)
 +d('9. Para memorizarlo: organizar una fiesta',`<p>Backlog: comprar comida, reservar lugar, invitaciones, decorar. Planning: esta semana comida e invitaciones. Sprint: una semana para lograrlo. Daily: ¿qué hiciste, qué harás, qué problema tienes? Seguimiento: ¿qué % de la fiesta está listo? Review: ¿qué logramos? Retro: ¿qué mejoramos? Y vuelta a empezar.</p>`)
 +d('10. Errores comunes',`<ul><li>Meter más actividades al Sprint sin sacar otras.</li><li>Dailies largos o que se vuelven reportes para el jefe.</li><li>Saltarse la retrospectiva: sin ella no se mejora.</li><li>Dar por "Hecho" lo que no cumple la Definición de Terminado.</li><li>Cambiar el Sprint Goal a la mitad del Sprint.</li></ul>`)}

const getAuth=()=>{let a=null;try{a=JSON.parse(ls(AK))}catch(e){}if(a&&!a.users&&a.u)a={users:[{id:uid(),u:a.u,name:a.u,role:'admin',s:a.s,ph:a.ph,r:a.r,rh:a.rh}]};return a&&Array.isArray(a.users)&&a.users.length?a:null};
const setAuth=a=>ls(AK,JSON.stringify(a)),findU=n=>{const a=getAuth();return a&&a.users.find(x=>x.u.toLowerCase()==String(n).trim().toLowerCase())};
async function hash(t,s){const m=s+':'+t;if(window.crypto&&crypto.subtle)return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m)))].map(x=>x.toString(16).padStart(2,'0')).join('');let h=5381;for(const c of m)h=((h<<5)+h+c.charCodeAt(0))|0;return'f'+h}
const normCode=c=>String(c).replace(/[^A-Za-z0-9]/g,'').toUpperCase();
async function mkUser(u,name,p,role){const s=uid()+uid(),r=uid()+uid(),b=new Uint8Array(16);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(b);else for(let i=0;i<16;i++)b[i]=Math.floor(Math.random()*256);const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code=[...b].map(x=>al[x%al.length]).join('').replace(/(.{4})(?=.)/g,'$1-');return{code,user:{id:uid(),u,name,role,s,ph:await hash(p,s),r,rh:await hash(normCode(code),r)}}}
const G={tries:0,until:0,me:null,pend:null,
 can(){return!!G.me&&G.me.role=='admin'},
 chip(){const m=G.me;return m?`<div class="usr"><span class="uav">${esc(ini(m.name))}</span><div><b>${esc(m.name)}</b><small>${m.role=='admin'?'Administrador':'Colaborador'}</small></div></div>`:''},
 box(h,t){const T={login:'',reg:'<h2>Crear cuenta</h2>'}[t]||'';$('#gate').innerHTML=`<div class="gwrap"><section class="gl1"><div class="gt">Sprint Manager</div><svg class="ill" viewBox="0 0 200 150" fill="none" stroke="#1d2540" stroke-width="2" stroke-linejoin="round"><circle cx="38" cy="32" r="9" fill="#4cc9b0"/><path d="M26 32h24" stroke-width="2"/><circle cx="164" cy="46" r="11" fill="#ee7b61"/><path d="M152 44l24 5"/><path d="M100 10c15 18 19 52 16 92H84c-3-40 1-74 16-92z" fill="#fff"/><circle cx="100" cy="52" r="8" fill="#4cc9b0"/><path d="M84 70L64 102l20-4zM116 70l20 32-20-4z" fill="#fff"/><path d="M92 102v10M100 102v14M108 102v10"/><g fill="#fff"><circle cx="62" cy="124" r="14"/><circle cx="84" cy="130" r="16"/><circle cx="108" cy="130" r="16"/><circle cx="132" cy="124" r="14"/><circle cx="96" cy="118" r="12"/></g></svg><button class="gb a" onclick="G.show('reg')">Crear cuenta</button><button class="gb b" onclick="G.show('login')">Iniciar sesión</button><small>Coordinación de Política Digital · Bi-nnova</small></section><aside class="gside gcard"><svg class="ill" viewBox="0 0 200 130" fill="none" stroke="#1d2540" stroke-width="2" stroke-linejoin="round"><circle cx="30" cy="70" r="9" fill="#ee7b61"/><path d="M164 22a16 16 0 1 0 6 24 12 12 0 0 1-6-24z" fill="#4cc9b0"/><g transform="rotate(32 100 65)"><rect x="52" y="52" width="32" height="26" fill="#fff"/><rect x="116" y="52" width="32" height="26" fill="#fff"/><rect x="84" y="50" width="32" height="30" fill="#fff"/><path d="M84 66h32" stroke="#ee7b61" stroke-width="5"/><path d="M92 50l-6-22 22 10z" fill="#fff"/><path d="M100 50V38" /></g></svg>${t?`<div class="gtabs"><button class="btn ${t=='login'?'p':''}" onclick="G.show('login')">Ya tengo cuenta</button><button class="btn ${t=='reg'?'p':''}" onclick="G.show('reg')">Registrarme</button></div>`:''}${T}${h}</aside></div>`},
 msg(t){const e=$('#gm');if(e)e.textContent=t},
 busy:0,
 async run(f){if(G.busy)return;G.busy=1;try{await G[f]()}catch(e){console.error(e);G.msg('Ocurrió un error: '+(e&&e.message||e))}finally{G.busy=0}},
 key(ev,f){if(ev.key==='Enter'&&ev.target.tagName!=='BUTTON'){ev.preventDefault();G.run(f)}},
 show(m){const first=!getAuth(),pw=(id,l,ac)=>`<label>${l}<input id="${id}" type="password" autocomplete="${ac}"></label>`,u=`<label>Usuario<input id="gu" autocomplete="username"></label>`;
  const v={
   login:[`<div class="gf" onkeydown="G.key(event,'login')"><h2>Iniciar sesión</h2><label>Entrar como<select id="gr"><option value="colab">Colaborador</option><option value="admin">Administrador</option></select></label>${u}${pw('gp','Contraseña','current-password')}<div class="gm" id="gm"></div><button type="button" class="btn p" onclick="G.run('login')">Entrar</button></div><p style="text-align:center"><a href="#" onclick="G.show('forgot');return false">¿Olvidaste tu contraseña?</a></p>`,'login'],
   reg:[`<div class="gf" onkeydown="G.key(event,'register')"><label>Nombre completo<input id="gn" autocomplete="name"></label>${u}${pw('gp','Contraseña','new-password')}${pw('gc','Repite la contraseña','new-password')}${first?'<div class="note">Eres la primera persona: tu cuenta será de <b>administrador</b>.</div>':`<label>Tipo de cuenta<select id="grl" onchange="G.rolechg()"><option value="colab">Colaborador</option><option value="admin">Administrador</option></select></label><div id="gadm" style="display:none"><div class="note">La autorización llega al correo del administrador. Llena tus datos, pulsa <b>Solicitar autorización</b> y, cuando te den el código, escríbelo aquí y pulsa <b>Crear cuenta</b>.</div><div class="row"><button type="button" class="btn" onclick="G.run('request')">Solicitar autorización por correo</button><button type="button" class="btn" onclick="G.run('resend')">Reenviar correo</button></div><label>Código de autorización<input id="gac" autocomplete="off" placeholder="XXXX-XXXX"></label></div>`}<div class="gm" id="gm"></div><button type="button" class="btn p" onclick="G.run('register')">Crear cuenta</button></div>`,'reg'],
   forgot:[`<h2>Recuperar contraseña</h2><div class="gf" onkeydown="G.key(event,'reset')">${u}<label>Código de recuperación<input id="gq" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off"></label>${pw('gp','Nueva contraseña','new-password')}${pw('gc','Repite la nueva contraseña','new-password')}<div class="gm" id="gm"></div><button type="button" class="btn p" onclick="G.run('reset')">Restablecer contraseña</button></div><div class="note" style="margin-top:12px">El código se mostró al crear la cuenta. Sin servidor no hay correo de recuperación: si lo perdiste, pide a un administrador que elimine tu cuenta y vuelve a registrarte.</div><p style="text-align:center"><a href="#" onclick="G.show('login');return false">← Volver</a></p>`,'']
  }[m];G.box(v[0],v[1])},
 rolechg(){$('#gadm').style.display=$('#grl').value=='admin'?'':'none'},
 locked(){if(Date.now()<G.until){G.msg('Demasiados intentos. Espera '+Math.ceil((G.until-Date.now())/1000)+' s');return 1}},
 fail(t){if(++G.tries>=5){G.until=Date.now()+30000;G.tries=0}G.msg(t)},
 async login(){if(G.locked())return;const x=findU($('#gu').value);if(!x||await hash($('#gp').value,x.s)!=x.ph)return G.fail('Usuario o contraseña incorrectos');if($('#gr').value=='admin'&&x.role!='admin')return G.msg('Esta cuenta no tiene permisos de administrador. Entra como Colaborador.');G.tries=0;G.enter(x)},
 async register(){if(G.locked())return;const a=getAuth(),name=$('#gn').value.trim(),u=$('#gu').value.trim(),p=$('#gp').value;let role='colab';
  const wa=a&&$('#grl')&&$('#grl').value=='admin';if(wa&&$('#gac').value.trim())return G.activate(u);
  if(!name)return G.msg('Escribe tu nombre completo');if(!u)return G.msg('Escribe un usuario');if(!p)return G.msg('Escribe una contraseña');if(p!==$('#gc').value)return G.msg('Las contraseñas no coinciden');if(findU(u))return G.msg('Ese usuario ya existe');
  if(!a)role='admin';else if(wa)return G.msg('Para ser administrador pulsa «Solicitar autorización por correo» y escribe el código que te den.');
  const{user,code}=await mkUser(u,name,p,role),b=a||{users:[]};b.users.push(user);setAuth(b);G.tries=0;G.pend=user;G.reveal(code)},
 async reset(){if(G.locked())return;const a=getAuth(),x=findU($('#gu').value),p=$('#gp').value;if(!p)return G.msg('Escribe la nueva contraseña');if(p!==$('#gc').value)return G.msg('Las contraseñas no coinciden');
  if(!x||await hash(normCode($('#gq').value),x.r)!=x.rh)return G.fail('Usuario o código de recuperación incorrecto');
  const{user,code}=await mkUser(x.u,x.name,p,x.role);user.id=x.id;a.users=a.users.map(z=>z.id==x.id?user:z);setAuth(a);G.tries=0;G.pend=user;G.reveal(code)},
 async request(){if(G.locked())return;const name=$('#gn').value.trim(),u=$('#gu').value.trim(),p=$('#gp').value;
  if(!name)return G.msg('Escribe tu nombre completo');if(!u)return G.msg('Escribe un usuario');if(!p)return G.msg('Escribe una contraseña');if(p!==$('#gc').value)return G.msg('Las contraseñas no coinciden');if(findU(u))return G.msg('Ese usuario ya existe');
  G.msg('Enviando solicitud…');
  const{user,code:rc}=await mkUser(u,name,p,'admin'),ac=G.newCode(),cs=uid()+uid(),pd=getPend();
  const r=await G.mail(name,u,ac);if(!r.ok)return G.msg(r.note);
  pd[u.toLowerCase()]={user,rc,cs,ch:await hash(normCode(ac),cs),t:Date.now()};setPend(pd);G.msg(r.note)},
 async mail(name,u,ac){if(location.protocol==='file:')return{ok:false,note:'El envío no funciona abriendo el archivo directo desde la computadora. Ábrelo desde el enlace https publicado (GitHub Pages).'};
  try{const r=await fetch('https://formsubmit.co/ajax/'+ADMIN_EMAIL,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({_subject:'Sprint Manager · Solicitud de administrador',_template:'table',_captcha:'false',Nombre:name,Usuario:u,'Código de autorización':ac,Fecha:new Date().toLocaleString('es-MX'),Instrucciones:'Si autorizas esta cuenta, comparte el código con la persona. Si no la reconoces, ignora este correo.'})});
   const j=await r.json().catch(()=>({})),m=String(j.message||'');
   if(!r.ok||String(j.success)==='false')return{ok:false,note:/activ/i.test(m)?'El servicio de correo necesita activarse: revisa la bandeja (y spam) del correo del administrador y confirma el mensaje de FormSubmit. Después pulsa «Reenviar correo».':'El servicio de correo respondió con un error'+(m?': '+m:'')+'.'};
   return{ok:true,note:/activ/i.test(m)?'Solicitud enviada, pero el servicio pide activar el correo: revisa la bandeja (y spam) del administrador y confirma el mensaje de FormSubmit. Después pulsa «Reenviar correo».':'Solicitud enviada al correo del administrador (revisa también spam). Cuando te den el código, escríbelo abajo y pulsa Crear cuenta. Si no llega, pulsa «Reenviar correo».'}}
  catch(e){return{ok:false,note:'No hay conexión con el servicio de correo (o el navegador la bloqueó). Revisa tu internet e inténtalo de nuevo.'}}},
 async resend(){if(G.locked())return;const u=$('#gu').value.trim(),pd=getPend(),e=pd[u.toLowerCase()];
  if(!u)return G.msg('Escribe tu usuario');if(!e)return G.msg('No hay una solicitud para ese usuario. Pulsa primero «Solicitar autorización por correo».');
  const ac=G.newCode(),cs=uid()+uid();G.msg('Reenviando…');const r=await G.mail(e.user.name,e.user.u,ac);
  if(!r.ok)return G.msg(r.note);e.cs=cs;e.ch=await hash(normCode(ac),cs);e.t=Date.now();setPend(pd);G.msg('Correo reenviado con un código nuevo (el anterior ya no sirve). '+r.note.replace(/^Solicitud enviada[^.]*\.\s*/,''))},
 newCode(){const b=new Uint8Array(8);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(b);else for(let i=0;i<8;i++)b[i]=Math.floor(Math.random()*256);const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return[...b].map(x=>al[x%al.length]).join('').replace(/(.{4})(?=.)/g,'$1-')},
 async activate(u){const pd=getPend(),e=pd[String(u).trim().toLowerCase()];
  if(!e||Date.now()-e.t>3*864e5)return G.fail('No hay una solicitud vigente para ese usuario. Pide autorización de nuevo.');
  if(await hash(normCode($('#gac').value),e.cs)!=e.ch)return G.fail('Código de autorización incorrecto');
  if(findU(e.user.u))return G.msg('Ese usuario ya existe');
  const a=getAuth()||{users:[]};a.users.push(e.user);setAuth(a);delete pd[e.user.u.toLowerCase()];setPend(pd);G.tries=0;G.pend=e.user;G.reveal(e.rc)},
 reveal(code){G.cd=code;G.box(`<h2>Guarda tu código de recuperación</h2><p class="mu">Es la única forma de recuperar la contraseña. Se muestra una sola vez.</p><div class="gcode">${code}</div><div class="row"><button class="btn" onclick="G.dl()">⬇ Descargar</button><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(G.cd)">Copiar</button></div><button class="btn p" onclick="G.cd=null;G.enter(G.pend)">Ya lo guardé, entrar</button>`)},
 dl(){saveFile('codigo-recuperacion-sprint-manager.txt','Sprint Manager · código de recuperación\n'+G.cd+'\n','text/plain')},
 enter(x){G.me=x;try{sessionStorage.setItem(SK,x.id)}catch(e){}G.unlock()},
 unlock(){document.body.classList.remove('locked');const b=$('#bimp');if(b)b.style.display=G.can()?'':'none';R();if(!G.db){G.db=1;initDb()}},
 out(){try{sessionStorage.removeItem(SK)}catch(e){}G.me=null;document.body.classList.add('locked');G.show('login')},
 async chpw(){const a=getAuth(),x=a&&a.users.find(z=>z.id==G.me.id),n=$('#cpn').value;if(!x||await hash($('#cpo').value,x.s)!=x.ph)return alert('La contraseña actual no es correcta');if(!n)return alert('Escribe la nueva contraseña');x.s=uid()+uid();x.ph=await hash(n,x.s);setAuth(a);G.me=x;alert('Contraseña actualizada');R()},
 toggleRole(id){const a=getAuth(),x=a.users.find(z=>z.id==id);if(!x)return;if(x.role=='admin'&&a.users.filter(z=>z.role=='admin').length<2)return alert('Debe quedar al menos un administrador');x.role=x.role=='admin'?'colab':'admin';setAuth(a);R()},
 delUser(id){const a=getAuth(),x=a.users.find(z=>z.id==id);if(!x||id==G.me.id||!confirm('¿Eliminar la cuenta de '+x.name+'?'))return;a.users=a.users.filter(z=>z.id!=id);setAuth(a);R()},
 acc(){const a=getAuth(),me=G.me;if(!a||!me)return'';
  return`<div class="card"><h2>Mi cuenta</h2><p class="mu"><b>${esc(me.name)}</b> · @${esc(me.u)} · ${me.role=='admin'?'Administrador':'Colaborador'}</p><div class="row"><label>Contraseña actual<input id="cpo" type="password" autocomplete="current-password"></label><label>Nueva contraseña<input id="cpn" type="password" autocomplete="new-password"></label><button class="btn p" onclick="G.chpw()">Cambiar contraseña</button></div></div>`+
  (G.can()?`<div class="card"><h2>Usuarios registrados</h2>${a.users.map(x=>`<div class="rlm"><b>${esc(x.name)}</b> <span class="mu">@${esc(x.u)}</span><span class="ch ${x.role=='admin'?'g':'n'}">${x.role=='admin'?'Admin':'Colaborador'}</span>${x.id==me.id?'<span class="mu">(tú)</span>':`<button class="btn" onclick="G.toggleRole('${x.id}')">${x.role=='admin'?'Hacer colaborador':'Hacer admin'}</button><button class="btn" onclick="G.delUser('${x.id}')">Eliminar</button>`}</div>`).join('')}</div>`:'')},
 boot(){let id=null;try{id=sessionStorage.getItem(SK)}catch(e){}const a=getAuth(),m=a&&a.users.find(x=>x.id==id);m?G.enter(m):G.show(a?'login':'reg')}};
['imp','close','del','rlDel','rlAdd','rlMove'].forEach(k=>{const f=A[k];if(f)A[k]=function(){if(!G.can())return alert('Esta acción es solo para administradores.');return f.apply(A,arguments)}});
G.boot();
</script></body></html>
